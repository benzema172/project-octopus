<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 82" role="img" aria-label="Smukła ośmiornica siedząca na przycisku Wrzutnia">
  <defs>
    <linearGradient id="octo" x1="8" y1="4" x2="91" y2="73" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff2d86"/>
      <stop offset="0.36" stop-color="#8a2be2"/>
      <stop offset="0.70" stop-color="#315be9"/>
      <stop offset="1" stop-color="#00cfc2"/>
    </linearGradient>
    <linearGradient id="shine" x1="32" y1="5" x2="51" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-35%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.1" flood-color="#342052" flood-opacity=".25"/>
    </filter>
  </defs>
  <style>
    .tentacle{fill:none;stroke:url(#octo);stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:50% 10%;will-change:transform}
    .rear{stroke-width:5.4}
    .front{stroke-width:6.2}
    .t1{animation:w1 .76s ease-in-out -.18s infinite}.t2{animation:w2 .58s ease-in-out -.31s infinite}.t3{animation:w3 .72s ease-in-out -.46s infinite}.t4{animation:w2 .63s ease-in-out -.12s infinite reverse}.t5{animation:w1 .69s ease-in-out -.38s infinite reverse}.t6{animation:w3 .61s ease-in-out -.27s infinite reverse}.t7{animation:w2 .81s ease-in-out -.57s infinite}.t8{animation:w1 .65s ease-in-out -.22s infinite reverse}
    @keyframes w1{0%,100%{transform:rotate(-1.5deg)}35%{transform:rotate(4deg)}70%{transform:rotate(-3.5deg)}}
    @keyframes w2{0%,100%{transform:rotate(2deg)}38%{transform:rotate(-5deg)}72%{transform:rotate(4deg)}}
    @keyframes w3{0%,100%{transform:rotate(-1deg) scaleY(1)}40%{transform:rotate(4deg) scaleY(1.025)}76%{transform:rotate(-4deg) scaleY(.992)}}
    @media (prefers-reduced-motion:reduce){.tentacle{animation:none!important}}
  </style>

  <!-- Cień styku z górną krawędzią przycisku. -->
  <ellipse cx="43.5" cy="38.5" rx="17" ry="3.3" fill="#301a58" opacity=".16"/>

  <!-- Tylne macki są jak ramiona oparte o górną krawędź przycisku. -->
  <g class="tentacle rear t1"><path d="M34 35C27 35 21 33 16 29C11 25 7 27 8 31C10 37 20 40 33 38"/></g>
  <g class="tentacle rear t8"><path d="M54 35C62 35 70 32 78 27C83 24 87 27 85 31C82 37 70 40 55 38"/></g>

  <!-- Smukły korpus kończy się dokładnie na linii siedzenia. -->
  <g class="body" filter="url(#softShadow)">
    <path d="M32 35C29 29 29 21 31 13C33 6 38 2.5 44.5 2.5C51 2.5 56 6.5 58 13.5C60 21 59 29 55 35C51 40 36 40 32 35Z" fill="url(#octo)"/>
    <path d="M34.5 26C34 16 37.5 8.5 43 5.5C39.5 10 38 17 38.5 25C39 31 41 35 44 38C38.5 37 35 33 34.5 26Z" fill="url(#shine)"/>
    <ellipse cx="40" cy="18.5" rx="3.2" ry="5.1" fill="#21152e"/>
    <ellipse cx="49.6" cy="18.5" rx="3.2" ry="5.1" fill="#21152e"/>
    <circle cx="39.2" cy="16.7" r=".8" fill="#fff" opacity=".9"/>
    <circle cx="48.8" cy="16.7" r=".8" fill="#fff" opacity=".9"/>
  </g>

  <!-- Przednie macki startują na krawędzi i zwisają po froncie przycisku zamiast tworzyć wachlarz. -->
  <g class="tentacle front t2"><path d="M34 36C31 43 28 48 23 53C20 56 15 57 13 54C11 51 13 48 17 49C20 50 22 46 25 40"/></g>
  <g class="tentacle front t3"><path d="M38 37C35 46 34 54 36 61C37 65 34 68 30 67C26 66 26 62 29 59C32 56 31 48 33 40"/></g>
  <g class="tentacle front t4"><path d="M42 37C40 47 41 56 44 64C46 68 43 71 39 70C35 69 34 65 36 62C39 58 37 48 38 40"/></g>
  <g class="tentacle front t5"><path d="M46 37C46 47 49 56 53 63C56 67 54 71 50 72C46 72 43 68 45 64C47 60 44 49 42 40"/></g>
  <g class="tentacle front t6"><path d="M50 37C53 46 58 53 64 58C68 61 68 65 64 67C60 69 57 66 58 62C59 58 53 51 48 45"/></g>
  <g class="tentacle front t7"><path d="M54 36C61 41 68 44 75 45C80 46 82 50 79 53C76 56 72 54 72 51C71 48 63 45 55 43"/></g>
</svg>
