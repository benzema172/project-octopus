name: Temporary Next 16.3.6 lockfile upgrade

on:
  push:
    branches:
      - core-cleanup-performance-800

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Regenerate exact Next lockfile
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.3.6 eslint-config-next@16.3.6
      - name: Commit generated dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Security: upgrade Next.js to 16.3.6"
          git push
