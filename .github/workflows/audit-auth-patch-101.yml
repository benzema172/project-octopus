name: Audit authorization patch 1.0.1

on:
  push:
    branches:
      - agent/audit-1.0.1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[audit-auth-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-1.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_auth_patch_101.py
      - name: Commit authorization fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/company/records/route.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "1.0.1: derive authorization scope from real records [audit-auth-patch]"
          git push origin HEAD:agent/audit-1.0.1
