name: Live E2E Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/e2e-live-trigger.txt"
  push:
    branches: [main]
    paths:
      - "scripts/e2e-live-trigger.txt"

permissions:
  contents: read

concurrency:
  group: live-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://tlbqwbdfoeuvwdlmdzhd.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_GKNVG1MgDSyYhfhMn4um4g_GonPEXAE
      E2E_BASE_URL: https://project-octopus-alpha.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build audited branch
        run: npm run build
      - name: Black-box production integration audit
        run: node scripts/e2e-live-audit.mjs
