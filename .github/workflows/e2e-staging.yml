name: Staging E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: octopus-staging-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROVIDER: gemini
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start application
        run: |
          npm start > /tmp/octopus-e2e.log 2>&1 &
          echo $! > /tmp/octopus-e2e.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/octopus-e2e.log
          exit 1
      - name: Check external E2E configuration
        id: external
        shell: bash
        run: |
          if [[ -n "$NEXT_PUBLIC_SUPABASE_URL" && -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" && -n "$SUPABASE_SECRET_KEY" && -n "$R2_ENDPOINT" && -n "$R2_BUCKET_NAME" && -n "$R2_ACCESS_KEY_ID" && -n "$R2_SECRET_ACCESS_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "External Supabase/R2 E2E is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::External Supabase/R2 E2E skipped because repository secrets are not configured. Build and application-start checks still ran."
          fi
      - name: Real R2 upload E2E
        if: steps.external.outputs.ready == 'true'
        run: npm run test:e2e-upload
      - name: Core data integrity E2E
        if: steps.external.outputs.ready == 'true'
        run: npm run test:e2e-core
      - name: Record external E2E skip
        if: steps.external.outputs.ready != 'true'
        run: echo "External E2E skipped: configure Supabase/R2 GitHub Actions secrets to enable it."
      - name: Server log on failure
        if: failure()
        run: cat /tmp/octopus-e2e.log || true
