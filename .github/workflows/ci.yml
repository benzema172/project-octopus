name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production dependency audit
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            rm -f /tmp/npm-audit.log
            if timeout 90s npm audit --omit=dev --audit-level=high 2>&1 | tee /tmp/npm-audit.log; then
              exit 0
            fi
            code=${PIPESTATUS[0]}
            if [[ "$code" != "124" ]] && ! grep -Eqi "network timeout|audit endpoint returned an error|ECONN|ETIMEDOUT|EAI_AGAIN|ENETUNREACH" /tmp/npm-audit.log; then
              exit "$code"
            fi
            echo "npm audit: przejściowy błąd sieci (próba $attempt/3)."
            sleep $((attempt * 5))
          done
          echo "npm audit: registry niedostępne po 3 próbach."
          exit 1
      - name: Stability contract
        run: npm run check:stability
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Migration contract
        run: npm run test:migrations
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
