name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Upload regression source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: regression-source
          path: |
            components/auth/project-octopus-login.tsx
            app/globals.css
            lib/demo/guest-constants.ts
            app/layout-density-audit.css
            app/release-badge.css
            components/layout/company-shell.tsx
            components/company/operations/module-shell.tsx
            components/system/server-pagination.tsx
            app/finance-compact.css
            components/company/company-action-center.tsx
            app/api/company/records/route.ts
            app/api/settings/automation/route.ts
            app/api/company/power/route.ts
            app/api/projects/operations/route.ts
            app/api/assistant/route.ts
            lib/data/workspace.ts
            app/workspace/error.tsx
          retention-days: 1
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Stability contract
        run: npm run check:stability
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test -- --reporter=json --outputFile=vitest-results.json
      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: vitest-results.json
          if-no-files-found: error
          retention-days: 1
      - name: Migration contract
        run: npm run test:migrations
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
