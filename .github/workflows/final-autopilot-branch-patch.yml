name: Final Autopilot branch patch

on:
  push:
    branches:
      - agent/octopus-navigation-demo-full

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/octopus-navigation-demo-full
          fetch-depth: 0
      - name: Apply final branch-only fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/demo/extended-blueprint.ts')
          s = p.read_text()
          old = 'wbs_node_id: demoId(2100 + projectIndex, wbsIndex), evidence_type: evidenceType, title, required: true,'
          new = 'wbs_node_id: demoId(2100 + projectIndex, Number(wbsIndex)), evidence_type: evidenceType, title, required: true,'
          if old not in s:
              raise SystemExit('Expected extended-demo type patch target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          npm version 0.9.0 --no-git-tag-version
          cat > RELEASE_0.9.0.md <<'EOF'
          # Project Octopus 0.9.0 — Investment Autopilot

          - Mission Engine wylicza konkretne obowiązki z aktualnego stanu inwestycji.
          - Investment Autopilot tworzy bezpieczne szkice WM, protokołów i etapów harmonogramu oraz nie generuje wyników fizycznych prób ani podpisów.
          - Po analizie nowego dokumentu Autopilot synchronizuje inwestycję i wykrywa skutki rewizji.
          - Change Radar 2.0 pokazuje konsekwencje zmian dla WBS, BOQ, harmonogramu, materiałów, WM i protokołów.
          - Control 360° zawiera Project Health, następny krok, lokalne decyzje AI, matrycę instalacji i genealogię danych.
          - Reconciliation kontroluje pierwszą warstwę zgodności Projekt ↔ BOQ ↔ faktury ↔ WZ/RW/MM.
          - Menu inwestycji zostało skompresowane do Dashboardu i logicznych grup bez poziomego scrollowania.
          - Przycisk Wrzutni ma kodową, animowaną ośmiornicę w barwach Project Octopus.
          - Konto gosc/gosc otrzymuje rozbudowany, realistyczny portfel inwestycji, pracowników, floty, magazynu, finansów i dokumentów.
          EOF
          git rm .github/workflows/final-autopilot-branch-patch.yml
          git config user.name "Project Octopus Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Project Octopus 0.9.0 Investment Autopilot"
          git push origin HEAD:agent/octopus-navigation-demo-full
