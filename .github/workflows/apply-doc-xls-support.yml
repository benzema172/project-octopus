name: Apply DOC XLS support

on:
  push:
    branches:
      - agent/octopus-0.8.1-doc-xls

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/octopus-0.8.1-doc-xls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch source
        run: python scripts/apply-legacy-office.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Migration contract
        run: npm run test:migrations
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/r2/sanitize.ts lib/ai/office-extractor.ts lib/ai/process-document.ts components/documents/document-upload.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Support legacy DOC and XLS in Wrzutnia"
          git push origin HEAD:agent/octopus-0.8.1-doc-xls
