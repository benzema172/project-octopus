name: Apply DOC XLS support

on:
  push:
    branches:
      - agent/octopus-0.8.1-doc-xls

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/octopus-0.8.1-doc-xls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch Wrzutnia and extraction pipeline
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/r2/sanitize.ts')
          s = path.read_text()
          s = s.replace(
              'export const SUPPORTED_UPLOAD_ACCEPT = ".pdf,.docx,.xlsx,.csv,.png,.jpg,.jpeg,.webp,.zip,.xml,.txt,.json,.md";',
              'export const SUPPORTED_UPLOAD_ACCEPT = ".pdf,.doc,.docx,.xls,.xlsx,.csv,.png,.jpg,.jpeg,.webp,.zip,.xml,.txt,.json,.md";'
          )
          s = s.replace(
              '  docx: new Set(["application/vnd.openxmlformats-officedocument.wordprocessingml.document", "application/zip"]),',
              '  doc: new Set(["application/msword", "application/x-ole-storage", "application/x-cfb", "application/cdfv2"]),\n  docx: new Set(["application/vnd.openxmlformats-officedocument.wordprocessingml.document", "application/zip"]),'
          )
          s = s.replace(
              '  xlsx: new Set(["application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "application/zip"]),',
              '  xls: new Set(["application/vnd.ms-excel", "application/x-ole-storage", "application/x-cfb", "application/cdfv2"]),\n  xlsx: new Set(["application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "application/zip"]),'
          )
          s = s.replace(
              '  if (extension === "doc" || extension === "xls") {\n    return "Format DOC/XLS wymaga konwersji. Zapisz plik jako DOCX/XLSX albo PDF i spróbuj ponownie.";\n  }\n\n',
              ''
          )
          s = s.replace(
              'return "Nieobsługiwany format. Dozwolone są PDF, DOCX, XLSX, CSV, obrazy, ZIP, XML i pliki tekstowe.";',
              'return "Nieobsługiwany format. Dozwolone są PDF, DOC/DOCX, XLS/XLSX, CSV, obrazy, ZIP, XML i pliki tekstowe.";'
          )
          s = s.replace(
              'if (mimeType.includes("word") || lowerName.endsWith(".docx")) {',
              'if (mimeType.includes("word") || lowerName.endsWith(".doc") || lowerName.endsWith(".docx")) {'
          )
          path.write_text(s)

          path = Path('lib/ai/office-extractor.ts')
          s = path.read_text()
          s = s.replace('import "server-only";\n\nimport { inflateRawSync } from "node:zlib";', 'import "server-only";\n\nimport { createRequire } from "node:module";\nimport { inflateRawSync } from "node:zlib";')
          marker = 'const MAX_TOTAL_BYTES = 36 * 1024 * 1024;\n'
          insertion = '''const MAX_TOTAL_BYTES = 36 * 1024 * 1024;\nconst requireNode = createRequire(import.meta.url);\n\ntype LegacyWordDocument = {\n  getBody?: () => string;\n  getFootnotes?: () => string;\n  getEndnotes?: () => string;\n  getHeaders?: (options?: { includeFooters?: boolean }) => string;\n  getFooters?: () => string;\n  getAnnotations?: () => string;\n  getTextboxes?: (options?: { includeHeadersAndFooters?: boolean; includeBody?: boolean }) => string;\n};\ntype LegacyWordExtractor = { extract: (input: Buffer) => Promise<LegacyWordDocument> };\nconst WordExtractor = requireNode("word-extractor") as new () => LegacyWordExtractor;\nconst XLSX = requireNode("xlsx") as typeof import("xlsx");\n'''
          if marker not in s:
              raise SystemExit('office extractor constants marker not found')
          s = s.replace(marker, insertion, 1)
          functions = r'''
function safeLegacySection(reader: (() => string) | undefined) {
  if (!reader) return "";
  try {
    return reader().replace(/\u0000/g, "").trim();
  } catch {
    return "";
  }
}

export async function extractLegacyDocText(buffer: Buffer) {
  const extractor = new WordExtractor();
  const document = await extractor.extract(buffer);
  const sections = [
    ["Treść", safeLegacySection(document.getBody?.bind(document))],
    ["Nagłówki", safeLegacySection(document.getHeaders?.bind(document, { includeFooters: false }))],
    ["Stopki", safeLegacySection(document.getFooters?.bind(document))],
    ["Przypisy", safeLegacySection(document.getFootnotes?.bind(document))],
    ["Przypisy końcowe", safeLegacySection(document.getEndnotes?.bind(document))],
    ["Komentarze", safeLegacySection(document.getAnnotations?.bind(document))],
    ["Pola tekstowe", safeLegacySection(document.getTextboxes?.bind(document, { includeHeadersAndFooters: true, includeBody: true }))]
  ].filter((section) => section[1]);
  const text = sections.map(([label, value]) => `[${label}]\n${value}`).join("\n\n").trim();
  if (!text) throw new Error("Nie udało się odczytać tekstu ze starego pliku DOC.");
  return text;
}

export function extractLegacyXlsText(buffer: Buffer) {
  const workbook = XLSX.read(buffer, { type: "buffer", cellDates: true, sheetRows: 20_000 });
  const sheets: string[] = [];
  for (const name of workbook.SheetNames.slice(0, 100)) {
    const sheet = workbook.Sheets[name];
    if (!sheet) continue;
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "", blankrows: false }) as unknown[][];
    const lines = rows.slice(0, 20_000).map((row) => row.map((value) => String(value ?? "").replace(/[\t\r\n]+/g, " ").trim()).join("\t"));
    sheets.push(`[Arkusz: ${name}]\n${lines.join("\n")}`);
  }
  const text = sheets.join("\n\n").trim();
  if (!text) throw new Error("Nie udało się odczytać komórek ze starego pliku XLS.");
  return text;
}

'''
          marker = 'export function listZipContents(buffer: Buffer) {'
          if marker not in s:
              raise SystemExit('office extractor listZipContents marker not found')
          s = s.replace(marker, functions + marker, 1)
          path.write_text(s)

          path = Path('lib/ai/process-document.ts')
          s = path.read_text()
          old_import = 'import { extractDocxText, extractXlsxText, listZipContents } from "@/lib/ai/office-extractor";'
          new_import = 'import { extractDocxText, extractLegacyDocText, extractLegacyXlsText, extractXlsxText, listZipContents } from "@/lib/ai/office-extractor";'
          if old_import not in s:
              raise SystemExit('process import marker not found')
          s = s.replace(old_import, new_import, 1)
          s = s.replace('function prepareInput(fileName: string, mimeType: string, bytes: Buffer) {', 'async function prepareInput(fileName: string, mimeType: string, bytes: Buffer) {', 1)
          s = s.replace(
              '  if (ext === "docx") return { extractedText: extractDocxText(bytes) };\n  if (ext === "xlsx") return { extractedText: extractXlsxText(bytes) };',
              '  if (ext === "doc") return { extractedText: await extractLegacyDocText(bytes) };\n  if (ext === "docx") return { extractedText: extractDocxText(bytes) };\n  if (ext === "xls") return { extractedText: extractLegacyXlsText(bytes) };\n  if (ext === "xlsx") return { extractedText: extractXlsxText(bytes) };',
              1
          )
          s = s.replace('  if (ext === "xls" || ext === "doc") throw new Error("Starszy format wymaga konwersji do XLSX/DOCX przed analizą.");\n', '')
          old_prepared = '    const prepared = useFilesApi ? {} : prepareInput(version.file_name, version.mime_type, bytes);'
          new_prepared = '    const prepared = useFilesApi ? {} : await prepareInput(version.file_name, version.mime_type, bytes);'
          if old_prepared not in s:
              raise SystemExit('process prepared marker not found')
          s = s.replace(old_prepared, new_prepared, 1)
          path.write_text(s)

          path = Path('components/documents/document-upload.tsx')
          s = path.read_text()
          s = s.replace('PDF, Word, Excel, obrazy, XML i ZIP · do {MAX_SUPPORTED_UPLOAD_BYTES / 1024 / 1024} MB', 'PDF, DOC/DOCX, XLS/XLSX, CSV, obrazy, XML i ZIP · do {MAX_SUPPORTED_UPLOAD_BYTES / 1024 / 1024} MB')
          path.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Migration contract
        run: npm run test:migrations
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/r2/sanitize.ts lib/ai/office-extractor.ts lib/ai/process-document.ts components/documents/document-upload.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Support legacy DOC and XLS in Wrzutnia"
          git push origin HEAD:agent/octopus-0.8.1-doc-xls
