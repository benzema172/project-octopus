name: Read-only production panel verification
on:
  push:
    branches: [audits/production-20261121]
    paths: [".github/workflows/production-panel-audit.yml", "scripts/e2e-existing-panels.mjs", "scripts/e2e-construction-browser.mjs"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://tlbqwbdfoeuvwdlmdzhd.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_GKNVG1MgDSyYhfhMn4um4g_GonPEXAE
      E2E_BASE_URL: https://project-octopus-alpha.vercel.app
      E2E_GUEST_LOGIN: gosc
      E2E_GUEST_PASSWORD: gosc
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Render tab icon from the existing Octopus SVG
        run: |
          node --input-type=module <<'JS'
          import sharp from "sharp";
          const sizes = [16,32,48];
          const images = await Promise.all(sizes.map(size => sharp("public/octopus-intake-sitting.svg").resize(size,size,{fit:"contain",background:{r:0,g:0,b:0,alpha:0}}).png().toBuffer()));
          const header=Buffer.alloc(6+sizes.length*16);
          header.writeUInt16LE(1,2);header.writeUInt16LE(sizes.length,4);
          let offset=header.length;
          for(const [i,img] of images.entries()) {
            const p=6+i*16; header[p]=sizes[i];header[p+1]=sizes[i];header.writeUInt16LE(1,p+4);header.writeUInt16LE(32,p+6);header.writeUInt32LE(img.length,p+8);header.writeUInt32LE(offset,p+12);offset+=img.length;
          }
          console.log("OCTOPUS_SOURCE_ICON="+Buffer.concat([header,...images]).toString("base64"));
          JS
      - name: Verify the three expanded production panels
        run: |
          chromedriver --port=9515 > "$RUNNER_TEMP/octopus-chromedriver.log" 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          node scripts/e2e-existing-panels.mjs
