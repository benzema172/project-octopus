name: Prepare Office legacy dependencies

on:
  push:
    branches:
      - agent/octopus-0.8.1-doc-xls

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/octopus-0.8.1-doc-xls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate package metadata
        run: |
          npm pkg set version=0.8.1
          npm install --save-exact word-extractor@1.0.4 https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
      - name: Commit dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add legacy DOC and XLS parser dependencies"
          git push origin HEAD:agent/octopus-0.8.1-doc-xls
