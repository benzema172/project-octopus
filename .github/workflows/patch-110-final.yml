name: Patch 1.1 final wiring

on:
  push:
    branches:
      - agent/stability-1.1-staging
    paths:
      - scripts/patch-110-final.py
      - .github/workflows/patch-110-final.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stability-1.1-staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch-110-final.py
      - name: Remove one-shot patch files
        run: git rm scripts/patch-110-final.py .github/workflows/patch-110-final.yml
      - name: Commit patch
        run: |
          git config user.name "Project Octopus CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/company/records/route.ts supabase/migrations/20260818100000_110_operating_scale.sql tests/stability-1.1.test.ts
          git commit -m "Project Octopus 1.1 — wire atomic reports and dedupe cashflow"
          git push origin HEAD:agent/stability-1.1-staging
