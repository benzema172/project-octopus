name: Audit 1.0.1 patch

on:
  push:
    branches:
      - agent/audit-1.0.1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[audit-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-1.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply audited source fixes
        run: python scripts/audit_patch_101.py
      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/company/records/route.ts components/company/company-operations-workspace.tsx components/company/company-power-tools.tsx lib/demo/extended-blueprint.ts scripts/validate-migrations-local.mjs
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "1.0.1: apply audit integrity fixes [audit-patch]"
          git push origin HEAD:agent/audit-1.0.1
