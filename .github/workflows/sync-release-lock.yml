name: Sync release lock

on:
  push:
    branches:
      - agent/octopus-1.0-hardening

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[lock-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/octopus-1.0-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lock metadata when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already coherent"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "1.0: sync package lock metadata [lock-sync]"
          git push origin HEAD:agent/octopus-1.0-hardening
