name: Temporary HR editor lint fix

on:
  push:
    branches:
      - "feat/hr-calendar-leave-ranges-20260909"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[hr-editor-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: "feat/hr-calendar-leave-ranges-20260909"
      - name: Patch optimistic leave state
        shell: python
        run: |
          from pathlib import Path
          path = Path("components/company/hr/hr-timesheet-entry-editor-159.tsx")
          text = path.read_text()
          text = text.replace(
              'import { useEffect, useState, type FormEvent } from "react";',
              'import { startTransition, useOptimistic, useState, type FormEvent } from "react";'
          )
          old = '''  const [calendarLeaveActive, setCalendarLeaveActive] = useState(() => isVacationLeave(leave));

  useEffect(() => {
    if (leave !== null) setCalendarLeaveActive(isVacationLeave(leave));
  }, [leave]);'''
          new = '''  const [calendarLeaveActive, setOptimisticCalendarLeaveActive] = useOptimistic(isVacationLeave(leave));'''
          if old not in text:
              raise SystemExit("Expected leave synchronization block not found")
          text = text.replace(old, new)
          old_setter = '      setCalendarLeaveActive(nextVacation);'
          new_setter = '      startTransition(() => setOptimisticCalendarLeaveActive(nextVacation));'
          if old_setter not in text:
              raise SystemExit("Expected calendar leave setter not found")
          text = text.replace(old_setter, new_setter)
          path.write_text(text)
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/company/hr/hr-timesheet-entry-editor-159.tsx
          git commit -m "Napraw synchronizację Urlopu bez kaskadowego renderu [hr-editor-patched]"
          git push origin HEAD:feat/hr-calendar-leave-ranges-20260909
