name: Temporary warehouse invoice preview patch

on:
  push:
    branches: ["fix/warehouse-invoice-preview-final-20260910"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/warehouse-invoice-preview-final-20260910
      - name: Apply exact patch
        run: python scripts/tmp-warehouse-invoice-preview-final.py
      - name: Commit final source
        shell: bash
        run: |
          rm .github/workflows/tmp-warehouse-invoice-preview-final.yml scripts/tmp-warehouse-invoice-preview-final.py
          git config user.name "octopus-release-bot"
          git config user.email "octopus-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Magazyn: pokaż fakturę i dokładną pozycję w kartotece"
          git push origin HEAD:fix/warehouse-invoice-preview-final-20260910
