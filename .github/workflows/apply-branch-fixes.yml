name: Apply branch fixes

on:
  push:
    branches:
      - agent/octopus-navigation-demo-full
    paths:
      - .github/workflows/apply-branch-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/octopus-navigation-demo-full
          fetch-depth: 0
      - name: Patch navigation typing
        run: >-
          python -c 'from pathlib import Path; p=Path("components/projects/project-navigation.tsx"); s=p.read_text(); s=s.replace("  const groups: ProjectNavGroup[] = [\n","  const navigationGroups: ProjectNavGroup[] = [\n",1); s=s.replace("  ]\n    .map((group) => ({ ...group, items: group.items.filter((item) => allowedDomains.includes(item.domain)) }))\n    .filter((group) => group.items.length > 0);\n\n  const showDashboard","  ];\n\n  const groups: ProjectNavGroup[] = navigationGroups\n    .map((group): ProjectNavGroup => ({\n      ...group,\n      items: group.items.filter((item) => allowedDomains.includes(item.domain))\n    }))\n    .filter((group) => group.items.length > 0);\n\n  const showDashboard",1); s=s.replace("              onFocus={() => setOpenGroup(group.key)}\n            >","              onFocus={() => setOpenGroup(group.key)}\n              onBlur={(event) => {\n                if (!event.currentTarget.contains(event.relatedTarget as Node | null)) setOpenGroup(null);\n              }}\n            >",1); p.write_text(s)'
      - name: Patch extended demo BOQ typing
        run: >-
          python -c 'from pathlib import Path; p=Path("lib/demo/extended-blueprint.ts"); s=p.read_text(); s=s.replace("    const accepted = roundMoney(executed * (spec.status === \"paused\" ? 0.92 : 0.98));\n    dataset.boqItems.push({","    const accepted = roundMoney(executed * (spec.status === \"paused\" ? 0.92 : 0.98));\n    const adjustedUnitPrice = Number(unitPrice) + projectIndex * 9;\n    dataset.boqItems.push({",1); s=s.replace("      unit_price: unitPrice + projectIndex * 9,\n      total_price: roundMoney(quantity * (unitPrice + projectIndex * 9)),","      unit_price: adjustedUnitPrice,\n      total_price: roundMoney(quantity * adjustedUnitPrice),",1); p.write_text(s)'
      - name: Strengthen expanded demo tests
        run: >-
          python -c 'from pathlib import Path; p=Path("tests/guest-demo.test.ts"); s=p.read_text(); a="import { buildDemoDataset, validateDemoDataset } from \"../lib/demo/dataset\";\n"; s=s.replace(a,a+"import { EXTENDED_DEMO_EXPECTATIONS } from \"../lib/demo/extended-blueprint\";\n",1); pairs={"expect(demo.projects.length).toBeGreaterThanOrEqual(8);":"expect(demo.projects.length).toBeGreaterThanOrEqual(EXTENDED_DEMO_EXPECTATIONS.projects);","expect(demo.documents.length).toBeGreaterThanOrEqual(30);":"expect(demo.documents.length).toBeGreaterThanOrEqual(EXTENDED_DEMO_EXPECTATIONS.documents);","expect(demo.boqItems.length).toBeGreaterThanOrEqual(40);":"expect(demo.boqItems.length).toBeGreaterThanOrEqual(EXTENDED_DEMO_EXPECTATIONS.boqItems);","expect(demo.wbsNodes.length).toBeGreaterThanOrEqual(40);":"expect(demo.wbsNodes.length).toBeGreaterThanOrEqual(70);","expect(demo.scheduleActivities.length).toBeGreaterThanOrEqual(40);":"expect(demo.scheduleActivities.length).toBeGreaterThanOrEqual(EXTENDED_DEMO_EXPECTATIONS.scheduleActivities);","expect(demo.invoices.length).toBeGreaterThanOrEqual(20);":"expect(demo.invoices.length).toBeGreaterThanOrEqual(EXTENDED_DEMO_EXPECTATIONS.invoices);","expect(demo.employees.length).toBeGreaterThanOrEqual(12);":"expect(demo.employees.length).toBeGreaterThanOrEqual(EXTENDED_DEMO_EXPECTATIONS.employees);","expect(demo.stockItems.length).toBeGreaterThanOrEqual(16);":"expect(demo.stockItems.length).toBeGreaterThanOrEqual(28);","expect(demo.vehicles.length).toBeGreaterThanOrEqual(6);":"expect(demo.vehicles.length).toBeGreaterThanOrEqual(EXTENDED_DEMO_EXPECTATIONS.vehicles);"}; [None for old,new in pairs.items() if not (s:=s.replace(old,new,1))]; s=s.replace("    expect(demo.knowledgeEntries.length).toBeGreaterThanOrEqual(8);\n","    expect(demo.knowledgeEntries.length).toBeGreaterThanOrEqual(13);\n    expect(demo.warehouses.length).toBeGreaterThanOrEqual(EXTENDED_DEMO_EXPECTATIONS.warehouses);\n    expect(demo.timesheets.length).toBeGreaterThanOrEqual(140);\n    expect(demo.assignments.length).toBeGreaterThanOrEqual(49);\n",1); s=s.replace("    expect(demo.projects.some((row) => row.status === \"planned\")).toBe(true);\n","    expect(demo.projects.some((row) => row.status === \"planned\")).toBe(true);\n    expect(demo.projects.some((row) => row.status === \"paused\")).toBe(true);\n    expect(demo.projects.some((row) => row.status === \"tender\")).toBe(true);\n    expect(demo.documents.some((row) => String(row.name).endsWith(\".doc\"))).toBe(true);\n    expect(demo.documents.some((row) => String(row.name).endsWith(\".xls\"))).toBe(true);\n",1); p.write_text(s)'
      - name: Commit branch fixes and remove helper workflow
        run: |
          rm .github/workflows/apply-branch-fixes.yml
          git config user.name "Project Octopus Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize grouped navigation and realistic demo dataset"
          git push origin HEAD:agent/octopus-navigation-demo-full
