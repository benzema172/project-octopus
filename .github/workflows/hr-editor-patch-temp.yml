name: Temporary HR editor patch

on:
  push:
    branches:
      - "feat/hr-calendar-leave-ranges-20260909"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[hr-editor-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: "feat/hr-calendar-leave-ranges-20260909"
      - name: Patch optimistic leave state
        shell: bash
        run: |
          FILE="components/company/hr/hr-timesheet-entry-editor-159.tsx"
          perl -0pi -e 's/import \{ useEffect, useState, type FormEvent \} from "react";/import { startTransition, useOptimistic, useState, type FormEvent } from "react";/' "$FILE"
          perl -0pi -e 's/  const \[calendarLeaveActive, setCalendarLeaveActive\] = useState\(\(\) => isVacationLeave\(leave\)\);\n\n  useEffect\(\(\) => \{\n    if \(leave !== null\) setCalendarLeaveActive\(isVacationLeave\(leave\)\);\n  \}, \[leave\]\);/  const [calendarLeaveActive, setOptimisticCalendarLeaveActive] = useOptimistic(isVacationLeave(leave));/' "$FILE"
          perl -0pi -e 's/      setCalendarLeaveActive\(nextVacation\);/      startTransition(() => setOptimisticCalendarLeaveActive(nextVacation));/' "$FILE"
          grep -q 'useOptimistic(isVacationLeave(leave))' "$FILE"
          grep -q 'setOptimisticCalendarLeaveActive(nextVacation)' "$FILE"
          ! grep -q 'useEffect(() =>' "$FILE"
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/company/hr/hr-timesheet-entry-editor-159.tsx
          git commit -m "Napraw synchronizację Urlopu bez kaskadowego renderu [hr-editor-patched]"
          git push origin HEAD:feat/hr-calendar-leave-ranges-20260909
