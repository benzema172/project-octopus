name: Temporary dependency lock refresh

on:
  push:
    branches:
      - "feat/hr-calendar-leave-ranges-20260909"

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: "feat/hr-calendar-leave-ranges-20260909"
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Refresh patched framework and image stack
        run: npm install --package-lock-only --save-exact next@16.3.4 eslint-config-next@16.3.4 sharp@0.35.4 --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Zaktualizuj Next.js i sharp po audycie bezpieczeństwa [lock-refresh]"
          git push origin HEAD:feat/hr-calendar-leave-ranges-20260909
